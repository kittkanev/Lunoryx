name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make cmake libsdl2-dev liblua5.4-dev libgl1-mesa-dev libegl1-mesa-dev xvfb xauth ffmpeg
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Build bilingual offline manuals
        run: python tools/build_manual.py && git diff --exit-code -- src/editor/editor_guide_data.h docs/en docs/ru
      - name: Test geometry, Rust ABI and physics equivalence
        run: make -j2 test test-rust test-kernels test-physics
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.403'
      - name: Publish actual self-contained C# runtime
        run: dotnet publish extensions/csharp/Luaryx.Worker.csproj -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o Runtime
      - name: Build editor and integration tests
        run: KEEP_TEST_GLB=1 LUNORYX_CSHARP_WORKER="$PWD/Runtime/Luaryx.Worker" make -j2 engine engine-testing test-integration
      - name: Test Studio MCP and audio codecs
        run: python tools/test_mcp_capabilities.py ./engine && python tools/test_studio_mcp.py ./engine && python tools/test_audit_security.py ./engine && python tools/test_studio_audio.py
      - name: Test self-contained game and relocated resources
        run: |
          LUNORYX_TEST_RUNTIME="$PWD/engine-testing" LUNORYX_GAME_GUI=1 LUNORYX_GAME_SMOKE=1 SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 LUNORYX_CAPTURE_PATH="$PWD/build/game-linux.png" python3 tools/test_game_package.py ./engine
      - name: Measure portable kernels and physics against 1.0.1
        run: |
          make benchmark benchmark-physics benchmark-weld
          { rustc --version; g++ --version; uname -a; lscpu; } > build/benchmark-linux-environment.txt
      - name: Test FXAA, viewport state and postprocess cost
        run: |
          make test-postprocess test-render test-shadows
          SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 ./tests/viewport_postprocess_tests --bench > build/render-postprocess-linux.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-linux
          path: |
            build/performance-linux.csv
            build/physics-linux.csv
            build/weld-linux.csv
            build/benchmark-linux-environment.txt
            build/render-postprocess-linux.csv
            build/render-parity-linux.csv
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Validate binary glTF independently
        run: npm ci --prefix tools --ignore-scripts && node tools/validate_glb.cjs tests/test-scene.glb && node tools/validate_glb.cjs tests/textured.glb
      - name: Smoke test editor and timeout
        run: |
          mkdir -p build
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_UI_SMOKE=1 LUNORYX_CAPTURE_PATH=build/studio-smoke.png ./engine-testing
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=8 LUNORYX_GIZMO_SMOKE=1 LUNORYX_CAPTURE_PATH=build/gizmo-smoke.png ./engine-testing
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=2 LUNORYX_CAPTURE_PATH=build/modeling.png ./engine-testing --report-modeling
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=2 LUNORYX_CAPTURE_PATH=build/uv.png ./engine-testing --report-uv
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_RENDER_PRESET=quality LUNORYX_CAPTURE_PATH=build/render-quality.png ./engine-testing --report-rendering
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_RENDER_PRESET=office LUNORYX_CAPTURE_PATH=build/render-office.png ./engine-testing --report-rendering
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_CAPTURE_PATH=build/geometry-nodes.png ./engine-testing --report-nodes
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_CAPTURE_PATH=build/sculpt.png ./engine-testing --report-sculpt
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_RENDER_LEGACY=1 LUNORYX_RENDER_PRESET=office LUNORYX_CAPTURE_PATH=build/render-before.png ./engine-testing --report-rendering
          for axis in x y z; do
            timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=8 LUNORYX_GIZMO_SMOKE=1 LUNORYX_GIZMO_AXIS="$axis" ./engine-testing
            timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=8 LUNORYX_GIZMO_SMOKE=1 LUNORYX_GIZMO_AXIS="$axis" LUNORYX_GIZMO_NEGATIVE=1 ./engine-testing
          done
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=8 LUNORYX_SELECTION_SMOKE=1 ./engine-testing
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=8 LUNORYX_GAME_GUI_SMOKE=1 ./engine-testing
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=5 LUNORYX_RUNTIME_SMOKE=1 ./engine-testing
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=3 LUNORYX_CAPTURE_PATH=build/animation-docs.png ./engine-testing --report-animation
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=2 LUNORYX_CAPTURE_PATH=build/game-ui.png ./engine-testing --report-game-ui
          timeout 30s env SDL_VIDEODRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 TEST_TIMEOUT=2 LUNORYX_CAPTURE_PATH=build/game-build.png ./engine-testing --report-game-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gltf-validation
          path: |
            tests/test-scene.glb.validation.json
            build/studio-smoke.png
            build/gizmo-smoke.png
            build/modeling.png
            build/uv.png
            build/game-linux.png
            build/render-quality.png
            build/render-office.png
            build/geometry-nodes.png
            build/sculpt.png
            build/animation-docs.png
            build/game-ui.png
            build/game-build.png
            build/render-before.png
      - name: Address, undefined behavior and leak checks
        run: |
          make clean
          make -j2 test-integration test-kernels test-physics EXTRA_CXXFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' EXTRA_LDFLAGS='-fsanitize=address,undefined'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  mingw:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y cmake g++-mingw-w64-x86-64
      - name: Install pinned Rust cross toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --target x86_64-pc-windows-gnu
      - name: Prepare verified Lua and SDL2 dependencies
        run: bash tools/prepare_mingw.sh
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.403'
      - name: Publish self-contained Windows C# runtime
        run: dotnet publish extensions/csharp/Luaryx.Worker.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o build/win/Runtime
      - name: Build editor and Windows tests
        run: make -j2 -f Makefile.win package build/win/engine-testing.exe && python tools/verify_windows.py build/win/engine.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunoryx-windows-x64
          path: |
            build/win/*.exe
            build/win/README.md
            build/win/README.ru.md
            build/win/LICENSE
            build/win/NOTICE
            build/win/Runtime/
            build/win/examples/
            build/win/assets/
            build/win/docs/
            build/win/licenses/
  windows:
    runs-on: windows-2022
    needs: mingw
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lunoryx-windows-x64
      - name: Run MinGW binaries on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests | Out-Null
          & ./rust_kernel_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./physics_differential.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./modeling_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_csharp_worker.py ./Runtime/Luaryx.Worker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./engine_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_studio_mcp.py ./engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_mcp_capabilities.py ./engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_audit_security.py ./engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import wave,math,struct; f=wave.open('tests/tone.wav','wb'); f.setparams((1,2,22050,0,'NONE','not compressed')); f.writeframes(b''.join(struct.pack('<h',int(math.sin(i*.1)*12000)) for i in range(11025))); f.close()"
          $env:LUNORYX_AUDIO_NULL='1'
          & ./studio_audio_tests.exe tests/tone.wav
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure kernels and physics natively on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & ./performance.exe | Set-Content -Encoding utf8 build/performance-windows.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./physics_benchmark.exe | Set-Content -Encoding utf8 build/physics-windows.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./weld_operation.exe | Set-Content -Encoding utf8 build/weld-windows.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @([Environment]::OSVersion.VersionString, (Get-CimInstance Win32_Processor).Name) | Set-Content -Encoding utf8 build/benchmark-windows-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-windows
          path: |
            build/performance-windows.csv
            build/physics-windows.csv
            build/weld-windows.csv
            build/benchmark-windows-environment.txt
      - name: Prepare verified software OpenGL for Windows GUI tests
        shell: pwsh
        run: ./tools/prepare_windows_mesa.ps1
      - name: Test FXAA and viewport state on Windows Mesa
        shell: pwsh
        run: |
          Copy-Item (Join-Path $env:LUNORYX_MESA_DIR '*.dll') . -Force
          $env:GALLIUM_DRIVER='llvmpipe'
          & ./render_parity_tests.exe | Set-Content -Encoding utf8 build/render-parity-windows.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scene_shadow_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./viewport_postprocess_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./viewport_postprocess_tests.exe --bench | Set-Content -Encoding utf8 build/render-postprocess-windows.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test GUI input to Lua on Windows
        shell: pwsh
        run: |
          $env:LUNORYX_GAME_GUI_SMOKE='1'
          $env:TEST_TIMEOUT='8'
          & ./engine-testing.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:LUNORYX_GAME_GUI_SMOKE
      - name: Test viewport selection and signed gizmos on Windows
        shell: pwsh
        run: |
          python -c "import os,subprocess; e=dict(os.environ,TEST_TIMEOUT='8',LUNORYX_SELECTION_SMOKE='1'); subprocess.run(['./engine-testing.exe'],env=e,check=True,timeout=30)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,subprocess; base=dict(os.environ,TEST_TIMEOUT='8',LUNORYX_GIZMO_SMOKE='1'); [subprocess.run(['./engine-testing.exe'],env=dict(base,LUNORYX_GIZMO_AXIS=a,**({'LUNORYX_GIZMO_NEGATIVE':'1'} if sign else {})),check=True,timeout=30) for a in ['x','y','z'] for sign in [False,True]]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-render-windows
          path: |
            build/render-postprocess-windows.csv
            build/render-parity-windows.csv
      - name: Test native game packaging and complete the level on Windows
        shell: pwsh
        run: |
          $env:LUNORYX_TEST_RUNTIME=Join-Path $PWD 'engine-testing.exe'
          $env:LUNORYX_GAME_GUI='1'
          $env:LUNORYX_GAME_SMOKE='1'
          $env:GALLIUM_DRIVER='llvmpipe'
          $env:LUNORYX_CAPTURE_PATH=Join-Path $PWD 'build/game-windows.png'
          python tools/test_game_package.py ./engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunoryx-game-demo
          path: |
            build/GemTrail.exe
            build/game-windows.png

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            rid: osx-arm64
          - runner: macos-15-intel
            architecture: x86_64
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native dependencies
        run: |
          test "$(uname -m)" = '${{ matrix.architecture }}'
          brew install sdl2 lua@5.4 cmake pkg-config dylibbundler
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.403'
      - name: Build .NET runtime and native editor
        run: |
          dotnet publish extensions/csharp/Luaryx.Worker.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -p:RestoreLockedMode=true -o Runtime
          LUNORYX_CSHARP_WORKER="$PWD/Runtime/Luaryx.Worker" make -j2 -f Makefile.mac engine engine-testing test test-integration test-rust test-kernels test-physics
      - name: Test native MCP and parser boundaries
        run: |
          python3 tools/test_studio_mcp.py ./engine
          python3 tools/test_audit_security.py ./engine
      - name: Native OpenGL smoke and rendering tests
        run: |
          make -j2 -f Makefile.mac tests/render_parity_tests tests/scene_shadow_tests tests/viewport_postprocess_tests
          ./tests/render_parity_tests
          ./tests/scene_shadow_tests
          ./tests/viewport_postprocess_tests
          TEST_TIMEOUT=3 LUNORYX_UI_SMOKE=1 ./engine-testing
      - name: Package relocatable application and test the bundle
        run: |
          python3 tools/package_macos.py --runtime Runtime
          build/macos/Lunoryx.app/Contents/MacOS/Lunoryx --mcp < /dev/null
          otool -L build/macos/Lunoryx.app/Contents/MacOS/Lunoryx
          build/macos/Lunoryx.app/Contents/MacOS/Lunoryx --create-example build/mac-game.lunoryx
          build/macos/Lunoryx.app/Contents/MacOS/Lunoryx --build-game build/mac-game.lunoryx build/GemTrail.app
          build/GemTrail.app/Contents/MacOS/Game --verify-package
          tar -czf 'build/macos-${{ matrix.architecture }}.tar.gz' -C build/macos Lunoryx.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lunoryx-macos-${{ matrix.architecture }}
          path: build/macos-${{ matrix.architecture }}.tar.gz
