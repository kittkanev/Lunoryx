name: Publish verified Lunoryx release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Build and tests run for the current main commit
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: lunoryx-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the successful immutable main build
        run: |
          mkdir -p build/release
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > build/source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > build/source-jobs.json
          python - <<'PYCHECK'
          import json, os, re, subprocess
          from pathlib import Path
          run=json.loads(Path('build/source-run.json').read_text())
          jobs=json.loads(Path('build/source-jobs.json').read_text())['jobs']
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert run['name']=='Build and tests' and run['head_branch']=='main'
          assert run['repository']['full_name']==os.environ['GH_REPO']
          assert run['head_sha']==commit and run['status']=='completed' and run['conclusion']=='success'
          assert jobs and all(j['conclusion']=='success' for j in jobs)
          version=re.search(r'LUNORYX_VERSION "([^"]+)"',Path('engine_version.h').read_text())[1]
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'RELEASE_SHA={commit}\nRELEASE_TAG=v{version}\n')
          PYCHECK
      - name: Enforce immutable published tags
        id: state
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > build/existing-release.json 2>/dev/null; then
            tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            test "$tag_sha" = "$RELEASE_SHA" || { echo 'Refusing to replace a release tag'; exit 1; }
            published=$(python -c "import json; print(str(not json.load(open('build/existing-release.json'))['isDraft']).lower())")
            echo "published=$published" >> "$GITHUB_OUTPUT"
          fi
      - name: Download tested native artifacts and actual video evidence
        if: steps.state.outputs.published != 'true'
        run: |
          gh run download "$SOURCE_RUN" --name lunoryx-windows-x64 --dir build/windows
          gh run download "$SOURCE_RUN" --name lunoryx-macos-universal --dir build/macos
          gh run download "$SOURCE_RUN" --name lunoryx-verification --dir build/evidence
          python tools/package_release.py --artifact-dir build/windows --output-dir build/release
          cp build/macos/Lunoryx-macos-universal.zip build/release/
          cp build/evidence/Verification.mp4 build/release/
          python tools/build_release_report.py --run build/source-run.json --jobs build/source-jobs.json --evidence build/evidence --release-dir build/release
          python - <<'PYASSETS'
          from pathlib import Path
          expected={'Lunoryx-windows-x64.zip','Lunoryx-macos-universal.zip','Verification.mp4','Audit-report.html'}
          assert {p.name for p in Path('build/release').iterdir() if p.is_file()}==expected
          assert all((Path('build/release')/n).stat().st_size>0 for n in expected)
          PYASSETS
      - name: Attest exactly four verified files
        if: steps.state.outputs.published != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            build/release/Lunoryx-windows-x64.zip
            build/release/Lunoryx-macos-universal.zip
            build/release/Verification.mp4
            build/release/Audit-report.html
      - name: Publish the four-file release
        if: steps.state.outputs.published != 'true'
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "Lunoryx Studio $RELEASE_TAG" --notes-file "docs/release-notes-$RELEASE_TAG.md" --draft
          fi
          gh release upload "$RELEASE_TAG" build/release/Lunoryx-windows-x64.zip build/release/Lunoryx-macos-universal.zip build/release/Verification.mp4 build/release/Audit-report.html --clobber
          gh release view "$RELEASE_TAG" --json assets > build/release-assets.json
          python - <<'PYVERIFY'
          import json
          assets=json.load(open('build/release-assets.json'))['assets']
          assert len(assets)==4
          assert {a['name'] for a in assets}=={'Lunoryx-windows-x64.zip','Lunoryx-macos-universal.zip','Verification.mp4','Audit-report.html'}
          PYVERIFY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
      - name: Verify publication
        run: gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,targetCommitish,assets
