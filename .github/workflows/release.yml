name: Publish verified Lunoryx release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful build run for the release commit
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: lunoryx-studio-prerelease
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read version from tested source
        run: |
          version=$(python -c 'import re; print(re.search(r"LUNORYX_VERSION \"([^\"]+)\"", open("engine_version.h").read())[1])')
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Lunoryx Studio v$version" >> "$GITHUB_ENV"
      - name: Check publication state
        id: state
        run: |
          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ -n "$state" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo 'Refusing to replace an existing release commit' >&2
              exit 1
            elif [ "$state" = false ]; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Download the tested Windows artifact
        if: steps.state.outputs.published != 'true'
        run: gh run download "$SOURCE_RUN" --name lunoryx-windows-x64 --dir build/artifact
      - name: Package executable, instructions and licenses
        if: steps.state.outputs.published != 'true'
        run: |
          python tools/package_release.py --artifact-dir build/artifact --output-dir build/release
          test -s "build/release/Lunoryx-${RELEASE_TAG}-windows-x64.zip"
          test -s build/release/Lunoryx.exe
          test -s build/release/SHA256SUMS.txt
      - name: Download visual evidence from the tested run
        if: steps.state.outputs.published != 'true'
        run: |
          gh run download "$SOURCE_RUN" --name gltf-validation --dir build/visual
          cp "docs/release-notes-${RELEASE_TAG}.md" build/release/REPORT.md
          python - <<'PYREPORT'
          import os
          from pathlib import Path
          with Path('build/release/REPORT.md').open('a', encoding='utf-8') as report:
              report.write(f"\n\nПроверенный коммит: `{os.environ['RELEASE_SHA']}`.\n")
              report.write(f"\n[Успешный CI](https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['SOURCE_RUN']}).\n")
          PYREPORT
          find build/visual -name '*.png' -exec cp {} build/release/ \;
      - name: Attach the tested standalone sample game
        if: steps.state.outputs.published != 'true'
        run: |
          gh run download "$SOURCE_RUN" --name lunoryx-game-demo --dir build/game
          cp build/game/GemTrail.exe build/release/GemTrail.exe
          cp build/game/game-windows.png build/release/game-windows.png
      - name: Attach reproducible performance evidence
        if: steps.state.outputs.published != 'true'
        run: |
          gh run download "$SOURCE_RUN" --name performance-linux --dir build/perf-linux
          gh run download "$SOURCE_RUN" --name performance-windows --dir build/perf-windows
          gh run download "$SOURCE_RUN" --name performance-render-windows --dir build/perf-render
          find build/perf-linux build/perf-windows build/perf-render -type f \( -name '*.csv' -o -name '*.txt' \) -exec cp {} build/release/ \;
          cp docs/PERFORMANCE.md build/release/PERFORMANCE.md
          (cd build/release && sha256sum GemTrail.exe REPORT.md PERFORMANCE.md *.png *.csv benchmark-*-environment.txt >> SHA256SUMS.txt)
      - name: Attest verified release files
        if: steps.state.outputs.published != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/release/*
      - name: Create draft and upload verified files
        if: steps.state.outputs.published != 'true'
        run: |
          if [ '${{ steps.state.outputs.exists }}' != true ]; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TITLE" --notes-file build/release/REPORT.md --prerelease --draft
          fi
          gh release upload "$RELEASE_TAG" build/release/*.zip build/release/*.exe build/release/*.txt build/release/*.md build/release/*.png build/release/*.csv
          prerelease=true; latest=false
          if [[ "$RELEASE_TAG" != *-* ]]; then prerelease=false; latest=true; fi
          gh release edit "$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TITLE" --notes-file build/release/REPORT.md --draft=false --prerelease="$prerelease" --latest="$latest"
      - name: Retire the superseded 1.2.0 beta
        if: env.RELEASE_TAG == 'v1.2.0'
        run: |
          if gh release view v1.2.0-beta.1 >/dev/null 2>&1; then
            gh release edit v1.2.0-beta.1 --draft=true --latest=false
          fi
      - name: Verify published release
        run: |
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,targetCommitish,assets
